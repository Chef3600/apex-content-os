<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{background:#0a0a0b;font-family:Inter,'Helvetica Neue',Arial,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       color:#f4f2ee;position:relative}
  /* restrained warm gold wash, bottom-weighted, matches the shot grade */
  .glow{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);
        width:1500px;height:1500px;border-radius:50%;
        background:radial-gradient(circle,rgba(191,149,63,.17) 0%,rgba(191,149,63,.05) 42%,transparent 68%)}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.72) 100%)}
  .stack{position:relative;z-index:2;text-align:center;padding:0 96px}
  .rule{width:54px;height:1px;background:#bf953f;margin:0 auto 54px;opacity:.9}
  h1{font-size:96px;font-weight:600;letter-spacing:.055em;line-height:1.04;text-transform:uppercase}
  h1 .l2{display:block;font-weight:200;letter-spacing:.2em;font-size:72px;margin-top:14px;color:#e8e4dc}
  .svc{margin-top:52px;font-size:25px;font-weight:300;letter-spacing:.16em;
       text-transform:uppercase;color:#a8a29a;line-height:2.1}
  .cta{margin-top:96px;font-size:60px;font-weight:600;letter-spacing:.14em;
       text-transform:uppercase;color:#bf953f}
</style></head><body>
<div class="glow"></div><div class="vig"></div>
<div class="stack">
  <div class="rule"></div>
  <h1>Apex<span class="l2">Content Studio</span></h1>
  <div class="svc">Photography &nbsp;•&nbsp; Video<br>Campaign Creative &nbsp;•&nbsp; Websites</div>
  <div class="cta">Get Seen.</div>
</div>
</body></html>
